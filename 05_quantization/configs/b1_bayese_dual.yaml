# RDK X5 PTQ configuration for the unpruned B1 reference.
model_parameters:
  onnx_model: ../models/b1_original/b1_dual_output_opset11.onnx
  march: "bayes-e"
  layer_out_dump: False
  working_dir: ../work_b1_bayese
  output_model_file_prefix: b1_dual_bayese_960x832
input_parameters:
  input_name: "images"
  input_type_rt: 'nv12'
  input_type_train: 'rgb'
  input_layout_train: 'NCHW'
  norm_type: 'data_scale'
  scale_value: 0.003921568627451
calibration_parameters:
  cal_data_dir: ../calibration_images
  cal_data_type: 'float32'
  calibration_type: 'default'
  optimization: set_Softmax_input_int8,set_Softmax_output_int8
compiler_parameters:
  jobs: 8
  compile_mode: 'latency'
  debug: true
  optimize_level: 'O3'
