[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sam3-prelabel"
version = "0.1.0"
description = "Local SAM 3.1 image prelabeling workspace"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.0",
  "opencv-python>=4.10",
  "sam3>=0.1.4",
]

[project.scripts]
sam3-prelabel = "sam3_prelabel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
